# Sync upstream Dom into gv70-smooth and gv70-experimental, without
# silently overwriting the GV70 changes on either branch.
#
# Place this file at: .github/workflows/sync-upstream-dom.yml  on the fork's
# DEFAULT branch (StarPilot). Scheduled workflows only run from the default
# branch, so a copy on gv70-smooth or gv70-experimental alone will NOT run
# on schedule. Keep StarPilot as the default branch. Do NOT make Dom,
# gv70-smooth, or gv70-experimental the default.
#
# Branches synced by this workflow (and ONLY these):
#   - gv70-smooth       (best-to-date: v1 + move-off calming + SysIndReq + damping 100)
#   - gv70-experimental (approach-build experiments + SysIndReq + damping 100,
#                        NO numbing/smoothing fixes that could mask turning)
# Deleted Nov 1, 2026 and NOT synced here: gv70-low-speed-tune, gv70-field-sweep.
#
# What it does, daily + on demand, independently per branch (matrix,
# fail-fast: false, so a failure on one branch does not block the other):
#   1. If the branch does not exist yet (gv70-experimental at first), skip
#      that matrix job with a summary note instead of failing.
#   2. Merge upstream StarPilotHQ/StarPilot Dom into the fork branch
#      (merge commit only, never rebase, never force-push).
#   3. If the merge CONFLICTS: abort the merge, push NOTHING for that
#      branch, and open a GitHub issue listing the conflicted files.
#      Unlike the old workflow, a prebuilt.json-only conflict is NOT
#      auto-resolved here: prebuilt.json is never rewritten by this
#      workflow, because a receipt recomputed inside the workflow could
#      hide a protected-file change from the merge. Resolve it manually
#      and recompute the receipt yourself (see the issue body).
#   4. If the merge is clean: check the branch's policy changes survived.
#      The check is generic, not a hardcoded marker, because the
#      move-off calming marker on gv70-smooth may change: if the policy
#      file differed from upstream Dom before the merge and no longer
#      does afterwards, the branch changes were lost in the merge, so
#      push NOTHING and open an issue instead. If the merge touched the
#      policy file at all, the summary flags it for manual review.
#   5. Only on a clean merge with branch changes intact does it push the
#      merge commit to that branch.
#
# IMPORTANT — receipt / Galaxy apply:
#   This workflow NEVER updates prebuilt.json. After every pushed merge,
#   the prebuilt.json receipt for the new head must be recomputed and
#   verified by a human/agent BEFORE any Galaxy apply to that branch.
#   A merge that changed protected files leaves the old receipt stale,
#   and applying with a stale receipt is not a safe update. The job
#   summary for every pushed merge says this explicitly.
#
# IMPORTANT — Issues must be enabled:
#   The conflict path REQUIRES GitHub Issues on the fork
#   (Settings -> General -> Features -> Issues). If Issues are disabled,
#   the issue step fails LOUDLY (no continue-on-error) and the job fails,
#   so a conflict is never silently skipped. Do not add continue-on-error
#   to the issue steps.
#
# NOTE — fork Dom branch:
#   This workflow does NOT sync the fork's Dom branch. It merges upstream
#   Dom directly into each target branch, so no push to Dom happens here
#   and no upstream workflow is triggered by a Dom push.
#
# NOTE — Actions in this fork:
#   Enabling Actions enables ALL workflows in the fork whose triggers
#   match, not just this one. Upstream workflows you do not want were
#   disabled in the fork's Actions tab on Oct 29, 2026; keep them disabled.
#   This file itself must be on the default branch to run on schedule.

name: Sync upstream Dom

on:
  schedule:
    - cron: "0 13 * * *"  # daily, 13:00 UTC = 09:00 EDT
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [gv70-smooth, gv70-experimental]
    # One run at a time per branch; a run for one branch never cancels
    # or blocks the other branch's run.
    concurrency:
      group: sync-upstream-dom-${{ matrix.branch }}
      cancel-in-progress: false
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: StarPilot
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check branch exists, set up git, fetch upstream
        id: check
        run: |
          # GitHub Actions runners have no git identity by default, and
          # git merge / git commit fail with "Committer identity unknown"
          # (exit 128) before any conflict detection. Set the standard
          # bot identity first.
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote add upstream https://github.com/StarPilotHQ/StarPilot.git || true
          git fetch upstream
          git fetch origin
          BRANCH="${{ matrix.branch }}"
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Sync skipped: $BRANCH does not exist yet"
              echo "No merge attempted, nothing pushed. Create the branch and re-run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream Dom into branch
        id: merge
        if: steps.check.outputs.skip != 'true'
        run: |
          BRANCH="${{ matrix.branch }}"
          POLICY="openpilot/starpilot/lateral/genesis_gv70_policy.py"
          git checkout "$BRANCH"
          OLD_HEAD="$(git rev-parse HEAD)"
          UPSTREAM_HEAD="$(git rev-parse upstream/Dom)"
          echo "old_head=$OLD_HEAD" >> "$GITHUB_OUTPUT"
          echo "upstream_head=$UPSTREAM_HEAD" >> "$GITHUB_OUTPUT"
          # Did the branch's policy file already differ from upstream
          # before this merge? Used later to detect a silent loss: a
          # branch that had policy changes and now has none lost them.
          if [ -n "$(git diff upstream/Dom -- "$POLICY")" ]; then
            echo "pre_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "pre_diff=false" >> "$GITHUB_OUTPUT"
          fi
          if git merge --no-edit upstream/Dom; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "new_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "files=$(git diff --name-only "$OLD_HEAD" HEAD | paste -sd ',' -)" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > /tmp/conflicted.txt || true
            echo "Conflicted files:"; cat /tmp/conflicted.txt || true
            echo "files=$(paste -sd ',' /tmp/conflicted.txt)" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Upstream merge conflict: $BRANCH"
              echo "Conflicted files:"
              echo '```'
              cat /tmp/conflicted.txt
              echo '```'
              echo "Nothing was pushed for this branch."
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort || true
          fi

      - name: Verify branch policy changes survived clean merge
        id: verify
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.conflict != 'true'
        run: |
          BRANCH="${{ matrix.branch }}"
          POLICY="openpilot/starpilot/lateral/genesis_gv70_policy.py"
          OLD_HEAD="${{ steps.merge.outputs.old_head }}"
          if [ ! -f "$POLICY" ]; then
            echo "lost=true" >> "$GITHUB_OUTPUT"
            echo "policy_touched=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.merge.outputs.pre_diff }}" = "true" ] && [ -z "$(git diff upstream/Dom -- "$POLICY")" ]; then
            # Had policy changes before, has none now: lost in the merge.
            echo "lost=true" >> "$GITHUB_OUTPUT"
            echo "policy_touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "lost=false" >> "$GITHUB_OUTPUT"
            if git diff --name-only "$OLD_HEAD" HEAD | grep -qx "$POLICY"; then
              echo "policy_touched=true" >> "$GITHUB_OUTPUT"
            else
              echo "policy_touched=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Open issue on merge conflict (no push, fail loudly if this fails)
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ matrix.branch }}
          UPSTREAM_HEAD: ${{ steps.merge.outputs.upstream_head }}
          OLD_HEAD: ${{ steps.merge.outputs.old_head }}
          FILES: ${{ steps.merge.outputs.files }}
        run: |
          # No continue-on-error here on purpose: if Issues are disabled
          # or issue creation fails, this step (and the job) must fail
          # loudly instead of silently skipping the conflict report.
          if [ "$BRANCH" = "gv70-smooth" ]; then
            INTENDED="v1 + move-off calming + SysIndReq + damping 100"
          else
            INTENDED="approach build + SysIndReq + damping 100, NO numbing/smoothing fixes"
          fi
          DATE="$(date -u +%F)"
          TITLE="[sync-conflict] $BRANCH — upstream Dom merge conflict $DATE"
          BODY="Daily upstream sync stopped: merging StarPilotHQ/StarPilot Dom into $BRANCH conflicted, so NOTHING was pushed for this branch and the comma is unchanged.

          - Branch: $BRANCH
          - Upstream Dom commit attempted: $UPSTREAM_HEAD
          - Fork head before merge: $OLD_HEAD
          - Conflicted files:
          \`\`\`
          $FILES
          \`\`\`

          Resolve manually: check out $BRANCH locally, merge upstream/Dom, resolve the conflicts preserving the intended branch state ($INTENDED), then recompute prebuilt.json receipt and VERIFY it before any Galaxy apply to this branch. Do not apply via Galaxy with a stale receipt.

          Note: prebuilt.json conflicts are NOT auto-resolved by this workflow. If prebuilt.json is the only conflict, that is expected when both sides changed its receipt line — recompute the receipt for the merged tree manually, verify no protected-file change was hidden by the merge, then push."
          # Do not open a duplicate if an open issue for this branch already exists; comment on it instead.
          EXISTING="$(gh issue list --repo itsgreat2misha/StarPilot --state open --limit 100 --json number,title | python3 -c "import json, os, sys; data = json.load(sys.stdin); print(next((str(i['number']) for i in data if i['title'].startswith('[sync-conflict] ' + os.environ['BRANCH'])), ''))")"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo itsgreat2misha/StarPilot --body "Upstream sync conflicted again on $DATE for $BRANCH (upstream $UPSTREAM_HEAD, fork head $OLD_HEAD). Conflicted files:
          \`\`\`
          $FILES
          \`\`\`
          Nothing was pushed for this branch. See the original issue body for the manual resolve + receipt re-verification steps."
          else
            gh issue create --repo itsgreat2misha/StarPilot --title "$TITLE" --body "$BODY"
          fi

      - name: Open issue if branch changes were lost (no push, fail loudly if this fails)
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.conflict != 'true' && steps.verify.outputs.lost == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ matrix.branch }}
          UPSTREAM_HEAD: ${{ steps.merge.outputs.upstream_head }}
          OLD_HEAD: ${{ steps.merge.outputs.old_head }}
        run: |
          # No continue-on-error here on purpose (see conflict issue step).
          if [ "$BRANCH" = "gv70-smooth" ]; then
            INTENDED="v1 + move-off calming + SysIndReq + damping 100"
          else
            INTENDED="approach build + SysIndReq + damping 100, NO numbing/smoothing fixes"
          fi
          DATE="$(date -u +%F)"
          TITLE="[sync-conflict] $BRANCH — branch changes lost in upstream merge $DATE"
          BODY="Daily upstream sync merged cleanly into $BRANCH, but the branch's policy changes are no longer present afterwards (policy file missing, or its diff vs upstream Dom is now empty when it was not before), so NOTHING was pushed for this branch and the comma is unchanged.

          - Branch: $BRANCH
          - Upstream Dom commit attempted: $UPSTREAM_HEAD
          - Fork head before merge: $OLD_HEAD

          This usually means upstream refactored genesis_gv70_policy.py and git auto-merged the branch changes away. Re-apply the intended branch state ($INTENDED) on top of the new upstream code, re-test, then recompute prebuilt.json receipt and VERIFY it before any Galaxy apply to this branch."
          EXISTING="$(gh issue list --repo itsgreat2misha/StarPilot --state open --limit 100 --json number,title | python3 -c "import json, os, sys; data = json.load(sys.stdin); print(next((str(i['number']) for i in data if i['title'].startswith('[sync-conflict] ' + os.environ['BRANCH'])), ''))")"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo itsgreat2misha/StarPilot --body "Upstream sync on $DATE for $BRANCH merged cleanly but the branch policy changes were lost (upstream $UPSTREAM_HEAD, fork head $OLD_HEAD). Nothing was pushed. See the original issue body for the manual re-apply + receipt re-verification steps."
          else
            gh issue create --repo itsgreat2misha/StarPilot --title "$TITLE" --body "$BODY"
          fi

      - name: Push merged branch and write summary
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.conflict != 'true' && steps.verify.outputs.lost != 'true'
        run: |
          BRANCH="${{ matrix.branch }}"
          git push origin "$BRANCH"
          {
            echo "### Upstream sync pushed: $BRANCH"
            echo "- Old head: ${{ steps.merge.outputs.old_head }}"
            echo "- New head: ${{ steps.merge.outputs.new_head }}"
            echo "- Upstream Dom head: ${{ steps.merge.outputs.upstream_head }}"
            echo "- Files changed by merge: ${{ steps.merge.outputs.files }}"
            echo "- Policy file touched by merge: ${{ steps.verify.outputs.policy_touched }}"
            echo ""
            echo "**Before any Galaxy apply to $BRANCH, recompute and verify the prebuilt.json receipt for the new head.** This workflow never updates prebuilt.json, so a merge that changed protected files leaves the old receipt stale."
            if [ "${{ steps.verify.outputs.policy_touched }}" = "true" ]; then
              echo "**Manual review required: the merge touched genesis_gv70_policy.py.** Confirm the intended branch changes are still intact before recomputing the receipt."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if sync did not push (conflict or lost changes)
        if: steps.check.outputs.skip != 'true' && (steps.merge.outputs.conflict == 'true' || steps.verify.outputs.lost == 'true')
        run: |
          echo "Sync did not push for ${{ matrix.branch }}: conflict=${{ steps.merge.outputs.conflict }}, lost=${{ steps.verify.outputs.lost }}"
          echo "See the GitHub issue and job summary. Branch unchanged."
          exit 1
