# Sync upstream testing into gv70-experimental and gv70-upstream-pr,
# without silently overwriting the GV70 changes on either of them.
#
# Place this file at: .github/workflows/sync-upstream-dom.yml  on the fork's
# DEFAULT branch (StarPilot). Scheduled workflows only run from the default
# branch, so a copy on gv70-experimental or gv70-upstream-pr alone will
# NOT run on schedule. Keep StarPilot as the default branch. Do NOT make
# testing or gv70-experimental the default.
#
# Branches synced by this workflow (and ONLY these):
#   - gv70-experimental (rebuilt Nov 18, 2026: the gv70-upstream-pr content
#                        PLUS the alpha-long ADRV startup sequencing fix —
#                        low-speed calm + crawl + friction turn-in helpers +
#                        ModelTurnAssist enabled with the turn lead REMOVED +
#                        ADRV heartbeat at first frame with the template
#                        harvested during the ADAS disable; PLUS the GV70
#                        torque saturation warning in selfdrived; NO
#                        approach-build, NO high-speed preview, NO turn
#                        lead, NO latAccelFactor #3, NO SP-GAIN)
#   - gv70-upstream-pr  (the upstream PR branch: low-speed calm + crawl +
#                        friction turn-in helpers + ModelTurnAssist enabled
#                        with the turn lead REMOVED; NO approach-build, NO
#                        high-speed preview, NO turn lead)
# Each branch's intended state is encoded per branch in the sync matrix
# (intended text + state_profile) and checked after every merge by the
# "Verify branch intended state" step; a mismatch pushes NOTHING.
# Deleted Nov 1, 2026 and NOT synced here: gv70-low-speed-tune, gv70-field-sweep.
# gv70-smooth was deleted Nov 18, 2026 and is NOT synced here.
#
# DESIGN (revised Nov 3, 2026 — this replaces the old "never touch
# prebuilt.json" doctrine):
#   The receipt in prebuilt.json is bookkeeping, not a safety gate. What
#   actually matters is that an upstream merge never silently undoes the
#   work on the files we experiment with. So:
#   1. The workflow recomputes prebuilt.json itself after every merge,
#      using the repo's own openpilot/common/prebuilt_manifest.py
#      inventory digest over the merged tree. Before trusting that
#      computation each run, it first reproduces the CURRENT head's
#      stored receipt from that head's tree; if it cannot, the job fails
#      and pushes NOTHING. A pushed head therefore always carries a
#      receipt that matches its own tree (verified again after writing).
#   2. A merge that conflicts ONLY on prebuilt.json is auto-resolved
#      (finish the merge, then recompute the receipt as above) — upstream
#      changes the receipt on essentially every testing advance, so treating
#      it as a conflict made a successful run impossible by design.
#   3. A merge that conflicts on ANY other file: abort, push NOTHING,
#      open/dedupe a [sync-conflict] issue, fail the job. Resolve by hand.
#   4. OUR_FILES gate (the real protection): the files carrying our
#      changes are listed in OUR_FILES below. Before the merge, the
#      workflow computes the merge base of the branch head and the
#      upstream head and records the AT-RISK set: the OUR_FILES the
#      BRANCH changed relative to that base. After the merge, an
#      at-risk file counts as LOST only if the merged result no longer
#      contains the branch's changes (merged blob identical to the
#      upstream blob while the branch blob differed from it): push
#      NOTHING, open/dedupe a [sync-conflict] issue saying changes
#      were LOST, fail the job. (Fixed Nov 18, 2026: the old check
#      compared branch files against the CURRENT upstream head, so a
#      file upstream itself had rewritten since the branch's base —
#      and the branch had never touched — looked "lost" when the
#      merge correctly took upstream's version. That false alarm
#      stopped both GV70 syncs on Nov 17, 2026; issues #9/#10.)
#   5. If upstream CHANGED any OUR_FILES file and the merge kept our diff
#      intact, the merge pushes as normal, but the job summary carries a
#      prominent "Upstream changed files we experiment with" section so
#      route analysis can account for it. Knowing, not blocking.
#   6. If the branch is already up to date with upstream, the job
#      concludes SUCCESS with an "already up to date" summary.
#   7. The job has timeout-minutes: 30. A hung step (e.g. the checkout
#      that sat for 2+ hours on Nov 3, 2026) fails fast and visibly
#      instead of running to the 360-minute platform default.
#   8. Checkout is deliberately light: fetch-depth 1 for the default
#      branch (only a carrier for this file), then targeted full-depth
#      fetches of ONLY the matrix branch and upstream testing. The old
#      full-clone checkout repeatedly hung for hours on this repo;
#      nothing else in the job needs any other ref.
#
# IMPORTANT — Issues must be enabled:
#   The conflict/lost paths REQUIRE GitHub Issues on the fork
#   (Settings -> General -> Features -> Issues). If Issues are disabled,
#   the issue step fails LOUDLY (no continue-on-error) and the job fails,
#   so a conflict is never silently skipped. Do not add continue-on-error
#   to the issue steps.
#
# NOTE — fork testing branch:
#   A separate job (sync-testing) fast-forwards the fork's testing
#   branch to upstream testing — fast-forward ONLY: if fork testing has
#   diverged, that job fails and pushes nothing for testing. The GV70
#   sync jobs do not depend on it: they merge upstream testing directly
#   into each target branch, exactly as before.
#   (Switched from Dom to testing Nov 21, 2026: upstream froze Dom at
#   2c9a556f and moved development and PRs to testing, which descends
#   from that head. The fork's Dom branch is no longer synced by this
#   workflow; it stays frozen at 2c9a556f for reference.)
#
# NOTE — Actions in this fork:
#   Enabling Actions enables ALL workflows in the fork whose triggers
#   match, not just this one. Upstream workflows you do not want were
#   disabled in the fork's Actions tab on Oct 29, 2026; keep them disabled.
#   This file itself must be on the default branch to run on schedule.

name: Sync upstream testing

on:
  schedule:
    - cron: "0 13 * * *"  # daily, 13:00 UTC = 09:00 EDT
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: StarPilot
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward fork testing to upstream testing
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote add upstream https://github.com/StarPilotHQ/StarPilot.git || true
          git fetch --no-tags upstream "+refs/heads/testing:refs/remotes/upstream/testing"
          git fetch --no-tags origin "+refs/heads/testing:refs/remotes/origin/testing"
          OLD_TESTING="$(git rev-parse origin/testing)"
          UPSTREAM_TESTING="$(git rev-parse upstream/testing)"
          if [ "$OLD_TESTING" = "$UPSTREAM_TESTING" ]; then
            {
              echo "### Fork testing already up to date"
              echo "- Head: $OLD_TESTING (unchanged)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Fast-forward ONLY: if fork testing has diverged from upstream
          # testing, --ff-only fails, this job fails, and nothing is
          # pushed for testing.
          git checkout -B testing origin/testing
          git merge --ff-only upstream/testing || {
            echo "Fork testing ($OLD_TESTING) is not a fast-forward of upstream testing ($UPSTREAM_TESTING) — needs manual review, nothing pushed for testing."
            exit 1
          }
          git push origin testing
          {
            echo "### Fork testing fast-forwarded to upstream testing"
            echo "- Old head: $OLD_TESTING"
            echo "- New head: $UPSTREAM_TESTING"
          } >> "$GITHUB_STEP_SUMMARY"

  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: gv70-experimental
            state_profile: gv70-exp
            intended: "low-speed calm + crawl/friction turn-in helpers + ModelTurnAssist enabled with the turn lead REMOVED + alpha-long ADRV startup sequencing fix (ADRV heartbeat at first frame, template harvested during the ADAS disable) + GV70 torque saturation warning in selfdrived (experimental only), NO approach-build, NO high-speed preview, NO turn lead, NO SP-GAIN"
          - branch: gv70-upstream-pr
            state_profile: gv70-pr
            intended: "low-speed calm + crawl/friction turn-in helpers + ModelTurnAssist enabled with the turn lead REMOVED, NO approach-build, NO high-speed preview, NO turn lead"
    # One run at a time per branch; a run for one branch never cancels
    # or blocks the other branch's run.
    concurrency:
      group: sync-upstream-testing-${{ matrix.branch }}
      cancel-in-progress: false
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: StarPilot
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check branch exists, set up git, fetch upstream
        id: check
        run: |
          # GitHub Actions runners have no git identity by default, and
          # git merge / git commit fail with "Committer identity unknown"
          # (exit 128) before any conflict detection. Set the standard
          # bot identity first.
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote add upstream https://github.com/StarPilotHQ/StarPilot.git || true
          BRANCH="${{ matrix.branch }}"
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Sync skipped: $BRANCH does not exist yet"
              echo "No merge attempted, nothing pushed. Create the branch and re-run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            # Targeted fetches only (see header note 8): full history is
            # needed for the merge base, but only for these two refs.
            git fetch --no-tags upstream "+refs/heads/testing:refs/remotes/upstream/testing"
            git fetch --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          fi

      - name: Load per-branch intended-state config
        if: steps.check.outputs.skip != 'true'
        env:
          STATE_PROFILE: ${{ matrix.state_profile }}
        run: |
          # Per-branch expected/forbidden markers (path<TAB>fixed string),
          # checked against the merged tree by the "Verify branch
          # intended state" step below. A branch is only ever checked
          # against its OWN intended state.
          POLICY="openpilot/starpilot/lateral/genesis_gv70_policy.py"
          MTA="openpilot/starpilot/lateral/model_turn_assist.py"
          CSEL="openpilot/starpilot/lateral/controller_selection.py"
          CSD="openpilot/selfdrive/controls/controlsd.py"
          CANFD="opendbc_repo/opendbc/car/hyundai/hyundaicanfd.py"
          STARTUP="opendbc_repo/opendbc/car/hyundai/gv70_startup.py"
          SD="openpilot/selfdrive/selfdrived/selfdrived.py"
          IFACE="opendbc_repo/opendbc/car/hyundai/interface.py"
          : > /tmp/expected_markers.tsv
          : > /tmp/forbidden_markers.tsv
          exp_marker() { printf '%s\t%s\n' "$1" "$2" >> /tmp/expected_markers.tsv; }
          forb_marker() { printf '%s\t%s\n' "$1" "$2" >> /tmp/forbidden_markers.tsv; }
          # Markers shared by every GV70 branch: the calm + crawl/friction
          # helpers, ModelTurnAssist enabled for the GV70, no SP-GAIN,
          # no latAccelFactor multiplier in the policy.
          exp_marker "$POLICY" 'GV70_CALM_'
          exp_marker "$POLICY" 'get_gv70_crawl_turn_in_ff_scale'
          exp_marker "$POLICY" 'get_gv70_turn_in_threshold_scale'
          exp_marker "$POLICY" 'get_gv70_turn_in_friction_scale'
          exp_marker "$CSEL" "policy_for(CP) in ('ioniq6', 'genesis_gv70_electrified')"
          forb_marker "$POLICY" '_sp_gain'
          forb_marker "$POLICY" 'latAccelFactor'
          forb_marker "$MTA" '_gv70_gate_lead'
          forb_marker "$CSEL" '_gv70_gate_lead'
          case "$STATE_PROFILE" in
            gv70-exp)
              # gv70-experimental: the gv70-pr state (approach-build, the
              # high-speed preview and the turn lead all ABSENT;
              # ModelTurnAssist enabled through the features entry point
              # with turn_lead off for the GV70) PLUS the alpha-long ADRV
              # startup sequencing fix in gv70_startup.py: prepare
              # harvests the ADRV 0x51 template during the ADAS disable
              # instead of gating on a pre-disable capture, and configure
              # keeps the None-template empty-0x51 continuation. PLUS
              # the GV70 torque saturation warning in selfdrived
              # (experimental only; the PR branch does not carry it).
              exp_marker "$CSEL" 'model_turn_assist_features'
              exp_marker "$CSEL" 'turn_lead=supported and not gv70'
              exp_marker "$STARTUP" 'def _harvest(self, packet)'
              exp_marker "$STARTUP" 'ci.CC.adrv_template = None'
              exp_marker "$SD" '_update_gv70_torque_saturation_warning'
              forb_marker "$POLICY" 'GV70_APPROACH'
              forb_marker "$POLICY" 'approach_curv_hist'
              forb_marker "$POLICY" 'approach_boost'
              forb_marker "$MTA" 'GV70_PREVIEW'
              forb_marker "$MTA" '_gv70_preview'
              forb_marker "$MTA" 'GV70_LEAD_'
              forb_marker "$CSEL" 'high_speed_preview'
              forb_marker "$CSD" 'high_speed_preview'
              ;;
            gv70-pr)
              # upstream PR branch: approach-build, the high-speed
              # preview and the turn lead are all ABSENT; ModelTurnAssist
              # is enabled through the features entry point with
              # turn_lead off for the GV70.
              exp_marker "$CSEL" 'model_turn_assist_features'
              exp_marker "$CSEL" 'turn_lead=supported and not gv70'
              forb_marker "$POLICY" 'GV70_APPROACH'
              forb_marker "$POLICY" 'approach_curv_hist'
              forb_marker "$POLICY" 'approach_boost'
              forb_marker "$MTA" 'GV70_PREVIEW'
              forb_marker "$MTA" '_gv70_preview'
              forb_marker "$MTA" 'GV70_LEAD_'
              forb_marker "$CSEL" 'high_speed_preview'
              forb_marker "$CSD" 'high_speed_preview'
              ;;
            *)
              echo "Unknown state_profile: $STATE_PROFILE"
              exit 1
              ;;
          esac
          echo "Loaded intended-state config for profile $STATE_PROFILE:"
          echo "--- expected ---"; cat /tmp/expected_markers.tsv
          echo "--- forbidden ---"; cat /tmp/forbidden_markers.tsv

      - name: Merge upstream testing into branch
        id: merge
        if: steps.check.outputs.skip != 'true'
        run: |
          BRANCH="${{ matrix.branch }}"
          # Files carrying our GV70 work. The survival gate below covers
          # exactly this set (generalised from the old policy-only check).
          OUR_FILES="openpilot/starpilot/lateral/genesis_gv70_policy.py
          openpilot/starpilot/lateral/model_turn_assist.py
          openpilot/starpilot/lateral/controller_selection.py
          openpilot/selfdrive/controls/controlsd.py
          opendbc_repo/opendbc/car/hyundai/carcontroller.py
          opendbc_repo/opendbc/car/hyundai/hyundaicanfd.py
          opendbc_repo/opendbc/car/hyundai/gv70_startup.py
          openpilot/selfdrive/selfdrived/selfdrived.py"
          echo "$OUR_FILES" > /tmp/our_files.txt
          git checkout "$BRANCH"
          OLD_HEAD="$(git rev-parse HEAD)"
          UPSTREAM_HEAD="$(git rev-parse upstream/testing)"
          echo "old_head=$OLD_HEAD" >> "$GITHUB_OUTPUT"
          echo "upstream_head=$UPSTREAM_HEAD" >> "$GITHUB_OUTPUT"
          # Self-validate the receipt computation BEFORE trusting it:
          # the digest of the current head's tree must reproduce the
          # receipt stored at the current head. If not, fail here and
          # push nothing — never write a receipt with an unproven method.
          python3 - <<'PYEOF'
          import importlib.util, json, subprocess, sys
          spec = importlib.util.spec_from_file_location('pbm', 'openpilot/common/prebuilt_manifest.py')
          pbm = importlib.util.module_from_spec(spec); spec.loader.exec_module(pbm)
          def entries(rev):
              out = []
              raw = subprocess.check_output(['git', 'ls-tree', '-rz', '-r', '--full-tree', rev]).decode()
              for rec in raw.split('\0'):
                  if rec:
                      meta, path = rec.split('\t', 1)
                      mode, kind, blob = meta.split()
                      assert kind == 'blob', rec
                      out.append((path, mode, blob))
              return out
          stored = json.loads(subprocess.check_output(['git', 'show', 'HEAD:prebuilt.json']))['protected_inventory_sha256']
          got = pbm.inventory_digest(entries('HEAD'))
          print(f'stored receipt at HEAD: {stored}')
          print(f'recomputed digest     : {got}')
          if got != stored:
              print('RECEIPT METHOD VALIDATION FAILED — aborting before merge')
              sys.exit(1)
          print('receipt method validated against current head')
          PYEOF
          # At-risk set for the survival gate: the OUR_FILES the BRANCH
          # changed relative to the MERGE BASE of the branch head and
          # the upstream head. (The pre-Nov-18 check compared against
          # the current upstream head instead, so any file upstream
          # itself had rewritten since the base — and the branch had
          # never touched — was flagged as "lost" when the merge
          # correctly took upstream's version; issues #9/#10.)
          MERGE_BASE="$(git merge-base "$OLD_HEAD" "$UPSTREAM_HEAD")"
          echo "merge_base=$MERGE_BASE" >> "$GITHUB_OUTPUT"
          : > /tmp/our_at_risk.txt
          while IFS= read -r f; do
            base_blob="$(git rev-parse -q --verify "$MERGE_BASE:$f" 2>/dev/null || true)"
            branch_blob="$(git rev-parse -q --verify "$OLD_HEAD:$f" 2>/dev/null || true)"
            if [ "$base_blob" != "$branch_blob" ]; then
              echo "$f" >> /tmp/our_at_risk.txt
            fi
          done < /tmp/our_files.txt
          echo "at_risk_files=$(paste -sd ',' /tmp/our_at_risk.txt)" >> "$GITHUB_OUTPUT"
          if git merge --no-edit upstream/testing; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "receipt_conflict_only=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > /tmp/conflicted.txt || true
            echo "Conflicted files:"; cat /tmp/conflicted.txt || true
            echo "files=$(paste -sd ',' /tmp/conflicted.txt)" >> "$GITHUB_OUTPUT"
            # A conflict on prebuilt.json ALONE is bookkeeping: finish
            # the merge with either side's receipt (it is recomputed in
            # the receipt step below) and continue.
            if [ "$(cat /tmp/conflicted.txt)" = "prebuilt.json" ]; then
              echo "Receipt-only conflict: finishing merge, receipt recomputed below."
              git checkout --ours prebuilt.json
              git add prebuilt.json
              git commit --no-edit
              echo "conflict=false" >> "$GITHUB_OUTPUT"
              echo "receipt_conflict_only=true" >> "$GITHUB_OUTPUT"
            else
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              echo "receipt_conflict_only=false" >> "$GITHUB_OUTPUT"
              {
                echo "### Upstream merge conflict: $BRANCH"
                echo "Conflicted files:"
                echo '```'
                cat /tmp/conflicted.txt
                echo '```'
                echo "Nothing was pushed for this branch."
              } >> "$GITHUB_STEP_SUMMARY"
              git merge --abort || true
            fi
          fi
          if [ "$(git rev-parse HEAD)" = "$OLD_HEAD" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi
          echo "merged_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Name this merged_files, NOT files: in the conflict path the merge
          # is aborted, HEAD == OLD_HEAD and this diff is empty, so writing it
          # to the files output overwrote the conflicted-files list set above
          # (last write to $GITHUB_OUTPUT wins) and the [sync-conflict] issue
          # body came out with an empty file list (issues #7/#8, Nov 16, 2026).
          echo "merged_files=$(git diff --name-only "$OLD_HEAD" HEAD | paste -sd ',' -)" >> "$GITHUB_OUTPUT"

      - name: Verify our files survived the merge
        id: verify
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.conflict != 'true'
        run: |
          OLD_HEAD="${{ steps.merge.outputs.old_head }}"
          UPSTREAM_HEAD="${{ steps.merge.outputs.upstream_head }}"
          # An at-risk file is LOST only if the merged result no longer
          # contains the branch's changes: merged blob identical to the
          # upstream blob while the branch blob differed from it.
          : > /tmp/our_lost.txt
          while IFS= read -r f; do
            branch_blob="$(git rev-parse -q --verify "$OLD_HEAD:$f" 2>/dev/null || true)"
            upstream_blob="$(git rev-parse -q --verify "$UPSTREAM_HEAD:$f" 2>/dev/null || true)"
            merged_blob="$(git rev-parse -q --verify "HEAD:$f" 2>/dev/null || true)"
            if [ "$merged_blob" = "$upstream_blob" ] && [ "$branch_blob" != "$upstream_blob" ]; then
              echo "$f" >> /tmp/our_lost.txt
            fi
          done < /tmp/our_at_risk.txt
          if [ -s /tmp/our_lost.txt ]; then
            echo "lost=true" >> "$GITHUB_OUTPUT"
          else
            echo "lost=false" >> "$GITHUB_OUTPUT"
          fi
          echo "lost_files=$(paste -sd ',' /tmp/our_lost.txt)" >> "$GITHUB_OUTPUT"
          # Which of OUR_FILES did this merge change on our branch?
          : > /tmp/our_touched.txt
          git diff --name-only "$OLD_HEAD" HEAD > /tmp/merge_files.txt || true
          while IFS= read -r f; do
            if grep -qx "$f" /tmp/merge_files.txt; then
              echo "$f" >> /tmp/our_touched.txt
            fi
          done < /tmp/our_files.txt
          echo "touched_files=$(paste -sd ',' /tmp/our_touched.txt)" >> "$GITHUB_OUTPUT"

      - name: Verify branch intended state
        id: state
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.conflict != 'true'
        run: |
          # Check the merged tree against THIS branch's intended state
          # (markers loaded by the "Load per-branch intended-state
          # config" step). A mismatch pushes NOTHING and fails the job
          # via the final step; this step itself only records the result.
          BRANCH="${{ matrix.branch }}"
          : > /tmp/state_mismatches.txt
          while IFS=$'\t' read -r f marker; do
            [ -z "$f" ] && continue
            if [ ! -f "$f" ] || ! grep -Fq -- "$marker" "$f"; then
              echo "MISSING $f :: $marker" >> /tmp/state_mismatches.txt
            fi
          done < /tmp/expected_markers.tsv
          while IFS=$'\t' read -r f marker; do
            [ -z "$f" ] && continue
            if [ -f "$f" ] && grep -Fq -- "$marker" "$f"; then
              echo "FORBIDDEN $f :: $marker" >> /tmp/state_mismatches.txt
            fi
          done < /tmp/forbidden_markers.tsv
          if [ -s /tmp/state_mismatches.txt ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Intended-state mismatch: $BRANCH"
              echo "The merged tree does not match this branch's intended state (${{ matrix.intended }}):"
              echo '```'
              cat /tmp/state_mismatches.txt
              echo '```'
              echo "Nothing was pushed for this branch."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          echo "mismatches=$(paste -sd ';' /tmp/state_mismatches.txt)" >> "$GITHUB_OUTPUT"

      - name: Recompute prebuilt.json receipt for the merged tree
        id: receipt
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.conflict != 'true' && steps.verify.outputs.lost != 'true' && steps.state.outputs.ok == 'true'
        run: |
          # After any merge that changed protected files, the inherited
          # prebuilt.json no longer matches the tree. Recompute it from
          # the merged tree with the repo's own digest (self-validated in
          # the merge step), commit it if it differs, and verify the
          # final head's receipt against its own tree before pushing.
          python3 - <<'PYEOF'
          import importlib.util, json, subprocess, sys
          spec = importlib.util.spec_from_file_location('pbm', 'openpilot/common/prebuilt_manifest.py')
          pbm = importlib.util.module_from_spec(spec); spec.loader.exec_module(pbm)
          def entries(rev):
              out = []
              raw = subprocess.check_output(['git', 'ls-tree', '-rz', '-r', '--full-tree', rev]).decode()
              for rec in raw.split('\0'):
                  if rec:
                      meta, path = rec.split('\t', 1)
                      mode, kind, blob = meta.split()
                      assert kind == 'blob', rec
                      out.append((path, mode, blob))
              return out
          digest = pbm.inventory_digest(entries('HEAD'))
          stored = json.loads(subprocess.check_output(['git', 'show', 'HEAD:prebuilt.json']))['protected_inventory_sha256']
          print(f'merged-tree digest: {digest}')
          print(f'stored receipt    : {stored}')
          changed = digest != stored
          if changed:
              with open('prebuilt.json', 'w') as fh:
                  fh.write(json.dumps({'schema_version': 1, 'protected_inventory_sha256': digest}, sort_keys=True) + '\n')
              subprocess.check_call(['git', 'add', 'prebuilt.json'])
              subprocess.check_call(['git', 'commit', '-m', 'prebuilt receipt for upstream testing merge (auto-recomputed by sync workflow)'])
              stored2 = json.loads(subprocess.check_output(['git', 'show', 'HEAD:prebuilt.json']))['protected_inventory_sha256']
              got2 = pbm.inventory_digest(entries('HEAD'))
              if stored2 != got2:
                  print('RECEIPT VERIFICATION FAILED after write — job will fail, nothing pushed')
                  sys.exit(1)
          with open('/tmp/receipt_changed.txt', 'w') as fh:
              fh.write('true' if changed else 'false')
          print('receipt updated' if changed else 'receipt already valid')
          PYEOF
          echo "receipt_changed=$(cat /tmp/receipt_changed.txt)" >> "$GITHUB_OUTPUT"
          echo "new_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open issue on merge conflict (no push, fail loudly if this fails)
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ matrix.branch }}
          UPSTREAM_HEAD: ${{ steps.merge.outputs.upstream_head }}
          OLD_HEAD: ${{ steps.merge.outputs.old_head }}
          FILES: ${{ steps.merge.outputs.files }}
        run: |
          # No continue-on-error here on purpose: if Issues are disabled
          # or issue creation fails, this step (and the job) must fail
          # loudly instead of silently skipping the conflict report.
          INTENDED="${{ matrix.intended }}"
          DATE="$(date -u +%F)"
          TITLE="[sync-conflict] $BRANCH — upstream testing merge conflict $DATE"
          BODY="Daily upstream sync stopped: merging StarPilotHQ/StarPilot testing into $BRANCH conflicted, so NOTHING was pushed for this branch and the comma is unchanged.

          - Branch: $BRANCH
          - Upstream testing commit attempted: $UPSTREAM_HEAD
          - Fork head before merge: $OLD_HEAD
          - Conflicted files:
          \`\`\`
          $FILES
          \`\`\`

          Resolve manually: check out $BRANCH locally, merge upstream/testing, resolve the conflicts preserving the intended branch state ($INTENDED). The prebuilt.json receipt is then recomputed by the sync workflow's method (or by hand with the same validated digest) — since Nov 3, 2026 the workflow auto-resolves prebuilt.json-only conflicts and recomputes receipts itself, so a conflict issue means a real file conflicted."
          # Do not open a duplicate if an open issue for this branch already exists; comment on it instead.
          EXISTING="$(gh issue list --repo itsgreat2misha/StarPilot --state open --limit 100 --json number,title | python3 -c "import json, os, sys; data = json.load(sys.stdin); print(next((str(i['number']) for i in data if i['title'].startswith('[sync-conflict] ' + os.environ['BRANCH'])), ''))")"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo itsgreat2misha/StarPilot --body "Upstream sync conflicted again on $DATE for $BRANCH (upstream $UPSTREAM_HEAD, fork head $OLD_HEAD). Conflicted files:
          \`\`\`
          $FILES
          \`\`\`
          Nothing was pushed for this branch. See the original issue body for the manual resolve steps."
          else
            gh issue create --repo itsgreat2misha/StarPilot --title "$TITLE" --body "$BODY"
          fi

      - name: Open issue if our changes were lost in a clean merge (no push, fail loudly if this fails)
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.conflict != 'true' && steps.verify.outputs.lost == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ matrix.branch }}
          UPSTREAM_HEAD: ${{ steps.merge.outputs.upstream_head }}
          OLD_HEAD: ${{ steps.merge.outputs.old_head }}
          LOST_FILES: ${{ steps.verify.outputs.lost_files }}
        run: |
          # No continue-on-error here on purpose (see conflict issue step).
          INTENDED="${{ matrix.intended }}"
          DATE="$(date -u +%F)"
          TITLE="[sync-conflict] $BRANCH — branch changes LOST in clean upstream merge $DATE"
          BODY="Daily upstream sync merged cleanly into $BRANCH, but our changes were LOST in the merge: the files below were changed on this branch relative to the merge base, and the merged result no longer contains the branch's changes, so NOTHING was pushed for this branch and the comma is unchanged.

          - Branch: $BRANCH
          - Upstream testing commit attempted: $UPSTREAM_HEAD
          - Fork head before merge: $OLD_HEAD
          - Files whose branch changes were lost:
          \`\`\`
          $LOST_FILES
          \`\`\`

          This usually means upstream refactored one of our files and git auto-merged the branch changes away. Re-apply the intended branch state ($INTENDED) on top of the new upstream code and re-test before pushing."
          EXISTING="$(gh issue list --repo itsgreat2misha/StarPilot --state open --limit 100 --json number,title | python3 -c "import json, os, sys; data = json.load(sys.stdin); print(next((str(i['number']) for i in data if i['title'].startswith('[sync-conflict] ' + os.environ['BRANCH'])), ''))")"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo itsgreat2misha/StarPilot --body "Upstream sync on $DATE for $BRANCH merged cleanly but branch changes were LOST (upstream $UPSTREAM_HEAD, fork head $OLD_HEAD). Lost files: $LOST_FILES. Nothing was pushed. See the original issue body for the manual re-apply steps."
          else
            gh issue create --repo itsgreat2misha/StarPilot --title "$TITLE" --body "$BODY"
          fi

      - name: Push merged branch and write summary
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.conflict != 'true' && steps.verify.outputs.lost != 'true' && steps.state.outputs.ok == 'true'
        run: |
          BRANCH="${{ matrix.branch }}"
          if [ "${{ steps.merge.outputs.up_to_date }}" = "true" ]; then
            {
              echo "### Already up to date: $BRANCH"
              echo "- Head: ${{ steps.merge.outputs.old_head }} (unchanged)"
              echo "- Upstream testing head: ${{ steps.merge.outputs.upstream_head }}"
              echo "Nothing to merge, nothing pushed. Receipt at head verified by the workflow's self-validated digest."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            git push origin "$BRANCH"
            {
              echo "### Upstream sync pushed: $BRANCH"
              echo "- Old head: ${{ steps.merge.outputs.old_head }}"
              echo "- New head: ${{ steps.receipt.outputs.new_head }}"
              echo "- Upstream testing head: ${{ steps.merge.outputs.upstream_head }}"
              echo "- Files changed by merge: ${{ steps.merge.outputs.merged_files }}"
              echo "- Receipt-only conflict auto-resolved: ${{ steps.merge.outputs.receipt_conflict_only }}"
              echo "- prebuilt.json receipt recomputed by workflow: ${{ steps.receipt.outputs.receipt_changed }} (digest self-validated against the previous head before the merge, and verified against the new tree after writing — the new head is Galaxy-safe as-is)"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${{ steps.verify.outputs.touched_files }}" ]; then
              {
                echo ""
                echo "## ⚠ Upstream changed files we experiment with"
                echo "The merge changed these files on $BRANCH while keeping our diffs intact:"
                echo "${{ steps.verify.outputs.touched_files }}" | tr ',' '\n' | sed 's/^/- /'
                echo ""
                echo "Route analysis should account for these upstream changes when judging this branch's behaviour."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Fail job if sync did not push (conflict, lost changes or state mismatch)
        if: steps.check.outputs.skip != 'true' && (steps.merge.outputs.conflict == 'true' || steps.verify.outputs.lost == 'true' || steps.state.outputs.ok == 'false')
        run: |
          echo "Sync did not push for ${{ matrix.branch }}: conflict=${{ steps.merge.outputs.conflict }}, lost=${{ steps.verify.outputs.lost }}, state_ok=${{ steps.state.outputs.ok }}"
          echo "State mismatches: ${{ steps.state.outputs.mismatches }}"
          echo "See the GitHub issue and job summary. Branch unchanged."
          exit 1
