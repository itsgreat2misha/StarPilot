# Sync upstream Dom into gv70-smooth and gv70-experimental, without
# silently overwriting the GV70 changes on either branch.
#
# Place this file at: .github/workflows/sync-upstream-dom.yml  on the fork's
# DEFAULT branch (StarPilot). Scheduled workflows only run from the default
# branch, so a copy on gv70-smooth or gv70-experimental alone will NOT run
# on schedule. Keep StarPilot as the default branch. Do NOT make Dom,
# gv70-smooth, or gv70-experimental the default.
#
# Branches synced by this workflow (and ONLY these):
#   - gv70-smooth       (SP-GAIN v1 + move-off calming + SysIndReq + damping 100)
#   - gv70-experimental (approach-build + gated TurnAssist + crawl + friction +
#                        broad calm + SysIndReq + damping 100, NO latAccelFactor
#                        #3, NO SP-GAIN / numbing fixes)
# Deleted Nov 1, 2026 and NOT synced here: gv70-low-speed-tune, gv70-field-sweep.
#
# DESIGN (revised Nov 3, 2026 — this replaces the old "never touch
# prebuilt.json" doctrine):
#   The receipt in prebuilt.json is bookkeeping, not a safety gate. What
#   actually matters is that an upstream merge never silently undoes the
#   work on the files we experiment with. So:
#   1. The workflow recomputes prebuilt.json itself after every merge,
#      using the repo's own openpilot/common/prebuilt_manifest.py
#      inventory digest over the merged tree. Before trusting that
#      computation each run, it first reproduces the CURRENT head's
#      stored receipt from that head's tree; if it cannot, the job fails
#      and pushes NOTHING. A pushed head therefore always carries a
#      receipt that matches its own tree (verified again after writing).
#   2. A merge that conflicts ONLY on prebuilt.json is auto-resolved
#      (finish the merge, then recompute the receipt as above) — upstream
#      changes the receipt on essentially every Dom advance, so treating
#      it as a conflict made a successful run impossible by design.
#   3. A merge that conflicts on ANY other file: abort, push NOTHING,
#      open/dedupe a [sync-conflict] issue, fail the job. Resolve by hand.
#   4. OUR_FILES gate (the real protection): the files carrying our
#      changes are listed in OUR_FILES below. Before the merge, the
#      workflow records which of them differ from upstream Dom on this
#      branch. After the merge, any of those files whose diff vs upstream
#      is GONE (or which is missing) means our work was silently undone
#      by a clean merge: push NOTHING, open/dedupe a [sync-conflict]
#      issue saying changes were LOST, fail the job.
#   5. If upstream CHANGED any OUR_FILES file and the merge kept our diff
#      intact, the merge pushes as normal, but the job summary carries a
#      prominent "Upstream changed files we experiment with" section so
#      route analysis can account for it. Knowing, not blocking.
#   6. If the branch is already up to date with upstream, the job
#      concludes SUCCESS with an "already up to date" summary.
#   7. The job has timeout-minutes: 30. A hung step (e.g. the checkout
#      that sat for 2+ hours on Nov 3, 2026) fails fast and visibly
#      instead of running to the 360-minute platform default.
#   8. Checkout is deliberately light: fetch-depth 1 for the default
#      branch (only a carrier for this file), then targeted full-depth
#      fetches of ONLY the matrix branch and upstream Dom. The old
#      full-clone checkout repeatedly hung for hours on this repo;
#      nothing else in the job needs any other ref.
#
# IMPORTANT — Issues must be enabled:
#   The conflict/lost paths REQUIRE GitHub Issues on the fork
#   (Settings -> General -> Features -> Issues). If Issues are disabled,
#   the issue step fails LOUDLY (no continue-on-error) and the job fails,
#   so a conflict is never silently skipped. Do not add continue-on-error
#   to the issue steps.
#
# NOTE — fork Dom branch:
#   This workflow does NOT sync the fork's Dom branch. It merges upstream
#   Dom directly into each target branch, so no push to Dom happens here
#   and no upstream workflow is triggered by a Dom push.
#
# NOTE — Actions in this fork:
#   Enabling Actions enables ALL workflows in the fork whose triggers
#   match, not just this one. Upstream workflows you do not want were
#   disabled in the fork's Actions tab on Oct 29, 2026; keep them disabled.
#   This file itself must be on the default branch to run on schedule.

name: Sync upstream Dom

on:
  schedule:
    - cron: "0 13 * * *"  # daily, 13:00 UTC = 09:00 EDT
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        branch: [gv70-smooth, gv70-experimental]
    # One run at a time per branch; a run for one branch never cancels
    # or blocks the other branch's run.
    concurrency:
      group: sync-upstream-dom-${{ matrix.branch }}
      cancel-in-progress: false
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: StarPilot
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check branch exists, set up git, fetch upstream
        id: check
        run: |
          # GitHub Actions runners have no git identity by default, and
          # git merge / git commit fail with "Committer identity unknown"
          # (exit 128) before any conflict detection. Set the standard
          # bot identity first.
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote add upstream https://github.com/StarPilotHQ/StarPilot.git || true
          BRANCH="${{ matrix.branch }}"
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Sync skipped: $BRANCH does not exist yet"
              echo "No merge attempted, nothing pushed. Create the branch and re-run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            # Targeted fetches only (see header note 8): full history is
            # needed for the merge base, but only for these two refs.
            git fetch --no-tags upstream "+refs/heads/Dom:refs/remotes/upstream/Dom"
            git fetch --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          fi

      - name: Merge upstream Dom into branch
        id: merge
        if: steps.check.outputs.skip != 'true'
        run: |
          BRANCH="${{ matrix.branch }}"
          # Files carrying our GV70 work. The survival gate below covers
          # exactly this set (generalised from the old policy-only check).
          OUR_FILES="openpilot/starpilot/lateral/genesis_gv70_policy.py
          openpilot/starpilot/lateral/model_turn_assist.py
          openpilot/starpilot/lateral/controller_selection.py
          openpilot/selfdrive/controls/controlsd.py
          opendbc_repo/opendbc/car/hyundai/carcontroller.py
          opendbc_repo/opendbc/car/hyundai/hyundaicanfd.py"
          echo "$OUR_FILES" > /tmp/our_files.txt
          git checkout "$BRANCH"
          OLD_HEAD="$(git rev-parse HEAD)"
          UPSTREAM_HEAD="$(git rev-parse upstream/Dom)"
          echo "old_head=$OLD_HEAD" >> "$GITHUB_OUTPUT"
          echo "upstream_head=$UPSTREAM_HEAD" >> "$GITHUB_OUTPUT"
          # Self-validate the receipt computation BEFORE trusting it:
          # the digest of the current head's tree must reproduce the
          # receipt stored at the current head. If not, fail here and
          # push nothing — never write a receipt with an unproven method.
          python3 - <<'PYEOF'
          import importlib.util, json, subprocess, sys
          spec = importlib.util.spec_from_file_location('pbm', 'openpilot/common/prebuilt_manifest.py')
          pbm = importlib.util.module_from_spec(spec); spec.loader.exec_module(pbm)
          def entries(rev):
              out = []
              raw = subprocess.check_output(['git', 'ls-tree', '-rz', '-r', '--full-tree', rev]).decode()
              for rec in raw.split('\0'):
                  if rec:
                      meta, path = rec.split('\t', 1)
                      mode, kind, blob = meta.split()
                      assert kind == 'blob', rec
                      out.append((path, mode, blob))
              return out
          stored = json.loads(subprocess.check_output(['git', 'show', 'HEAD:prebuilt.json']))['protected_inventory_sha256']
          got = pbm.inventory_digest(entries('HEAD'))
          print(f'stored receipt at HEAD: {stored}')
          print(f'recomputed digest     : {got}')
          if got != stored:
              print('RECEIPT METHOD VALIDATION FAILED — aborting before merge')
              sys.exit(1)
          print('receipt method validated against current head')
          PYEOF
          # Which of OUR_FILES differ from upstream before this merge?
          # Those diffs are our work; losing one in the merge is a stop.
          : > /tmp/our_pre_diff.txt
          while IFS= read -r f; do
            if [ ! -f "$f" ] || [ -n "$(git diff upstream/Dom -- "$f")" ]; then
              echo "$f" >> /tmp/our_pre_diff.txt
            fi
          done < /tmp/our_files.txt
          echo "pre_diff_files=$(paste -sd ',' /tmp/our_pre_diff.txt)" >> "$GITHUB_OUTPUT"
          if git merge --no-edit upstream/Dom; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "receipt_conflict_only=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > /tmp/conflicted.txt || true
            echo "Conflicted files:"; cat /tmp/conflicted.txt || true
            echo "files=$(paste -sd ',' /tmp/conflicted.txt)" >> "$GITHUB_OUTPUT"
            # A conflict on prebuilt.json ALONE is bookkeeping: finish
            # the merge with either side's receipt (it is recomputed in
            # the receipt step below) and continue.
            if [ "$(cat /tmp/conflicted.txt)" = "prebuilt.json" ]; then
              echo "Receipt-only conflict: finishing merge, receipt recomputed below."
              git checkout --ours prebuilt.json
              git add prebuilt.json
              git commit --no-edit
              echo "conflict=false" >> "$GITHUB_OUTPUT"
              echo "receipt_conflict_only=true" >> "$GITHUB_OUTPUT"
            else
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              echo "receipt_conflict_only=false" >> "$GITHUB_OUTPUT"
              {
                echo "### Upstream merge conflict: $BRANCH"
                echo "Conflicted files:"
                echo '```'
                cat /tmp/conflicted.txt
                echo '```'
                echo "Nothing was pushed for this branch."
              } >> "$GITHUB_STEP_SUMMARY"
              git merge --abort || true
            fi
          fi
          if [ "$(git rev-parse HEAD)" = "$OLD_HEAD" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi
          echo "merged_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "files=$(git diff --name-only "$OLD_HEAD" HEAD | paste -sd ',' -)" >> "$GITHUB_OUTPUT"

      - name: Verify our files survived the merge
        id: verify
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.conflict != 'true'
        run: |
          OLD_HEAD="${{ steps.merge.outputs.old_head }}"
          : > /tmp/our_lost.txt
          while IFS= read -r f; do
            if [ ! -f "$f" ] || [ -z "$(git diff upstream/Dom -- "$f")" ]; then
              echo "$f" >> /tmp/our_lost.txt
            fi
          done < /tmp/our_pre_diff.txt
          if [ -s /tmp/our_lost.txt ]; then
            echo "lost=true" >> "$GITHUB_OUTPUT"
          else
            echo "lost=false" >> "$GITHUB_OUTPUT"
          fi
          echo "lost_files=$(paste -sd ',' /tmp/our_lost.txt)" >> "$GITHUB_OUTPUT"
          # Which of OUR_FILES did this merge change on our branch?
          : > /tmp/our_touched.txt
          git diff --name-only "$OLD_HEAD" HEAD > /tmp/merge_files.txt || true
          while IFS= read -r f; do
            if grep -qx "$f" /tmp/merge_files.txt; then
              echo "$f" >> /tmp/our_touched.txt
            fi
          done < /tmp/our_files.txt
          echo "touched_files=$(paste -sd ',' /tmp/our_touched.txt)" >> "$GITHUB_OUTPUT"

      - name: Recompute prebuilt.json receipt for the merged tree
        id: receipt
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.conflict != 'true' && steps.verify.outputs.lost != 'true'
        run: |
          # After any merge that changed protected files, the inherited
          # prebuilt.json no longer matches the tree. Recompute it from
          # the merged tree with the repo's own digest (self-validated in
          # the merge step), commit it if it differs, and verify the
          # final head's receipt against its own tree before pushing.
          python3 - <<'PYEOF'
          import importlib.util, json, subprocess, sys
          spec = importlib.util.spec_from_file_location('pbm', 'openpilot/common/prebuilt_manifest.py')
          pbm = importlib.util.module_from_spec(spec); spec.loader.exec_module(pbm)
          def entries(rev):
              out = []
              raw = subprocess.check_output(['git', 'ls-tree', '-rz', '-r', '--full-tree', rev]).decode()
              for rec in raw.split('\0'):
                  if rec:
                      meta, path = rec.split('\t', 1)
                      mode, kind, blob = meta.split()
                      assert kind == 'blob', rec
                      out.append((path, mode, blob))
              return out
          digest = pbm.inventory_digest(entries('HEAD'))
          stored = json.loads(subprocess.check_output(['git', 'show', 'HEAD:prebuilt.json']))['protected_inventory_sha256']
          print(f'merged-tree digest: {digest}')
          print(f'stored receipt    : {stored}')
          changed = digest != stored
          if changed:
              with open('prebuilt.json', 'w') as fh:
                  fh.write(json.dumps({'schema_version': 1, 'protected_inventory_sha256': digest}, sort_keys=True) + '\n')
              subprocess.check_call(['git', 'add', 'prebuilt.json'])
              subprocess.check_call(['git', 'commit', '-m', 'prebuilt receipt for upstream Dom merge (auto-recomputed by sync workflow)'])
              stored2 = json.loads(subprocess.check_output(['git', 'show', 'HEAD:prebuilt.json']))['protected_inventory_sha256']
              got2 = pbm.inventory_digest(entries('HEAD'))
              if stored2 != got2:
                  print('RECEIPT VERIFICATION FAILED after write — job will fail, nothing pushed')
                  sys.exit(1)
          with open('/tmp/receipt_changed.txt', 'w') as fh:
              fh.write('true' if changed else 'false')
          print('receipt updated' if changed else 'receipt already valid')
          PYEOF
          echo "receipt_changed=$(cat /tmp/receipt_changed.txt)" >> "$GITHUB_OUTPUT"
          echo "new_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open issue on merge conflict (no push, fail loudly if this fails)
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ matrix.branch }}
          UPSTREAM_HEAD: ${{ steps.merge.outputs.upstream_head }}
          OLD_HEAD: ${{ steps.merge.outputs.old_head }}
          FILES: ${{ steps.merge.outputs.files }}
        run: |
          # No continue-on-error here on purpose: if Issues are disabled
          # or issue creation fails, this step (and the job) must fail
          # loudly instead of silently skipping the conflict report.
          if [ "$BRANCH" = "gv70-smooth" ]; then
            INTENDED="SP-GAIN v1 + move-off calming + SysIndReq + damping 100"
          else
            INTENDED="approach-build + gated TurnAssist + crawl + friction + broad calm + SysIndReq + damping 100, NO latAccelFactor #3, NO SP-GAIN"
          fi
          DATE="$(date -u +%F)"
          TITLE="[sync-conflict] $BRANCH — upstream Dom merge conflict $DATE"
          BODY="Daily upstream sync stopped: merging StarPilotHQ/StarPilot Dom into $BRANCH conflicted, so NOTHING was pushed for this branch and the comma is unchanged.

          - Branch: $BRANCH
          - Upstream Dom commit attempted: $UPSTREAM_HEAD
          - Fork head before merge: $OLD_HEAD
          - Conflicted files:
          \`\`\`
          $FILES
          \`\`\`

          Resolve manually: check out $BRANCH locally, merge upstream/Dom, resolve the conflicts preserving the intended branch state ($INTENDED). The prebuilt.json receipt is then recomputed by the sync workflow's method (or by hand with the same validated digest) — since Nov 3, 2026 the workflow auto-resolves prebuilt.json-only conflicts and recomputes receipts itself, so a conflict issue means a real file conflicted."
          # Do not open a duplicate if an open issue for this branch already exists; comment on it instead.
          EXISTING="$(gh issue list --repo itsgreat2misha/StarPilot --state open --limit 100 --json number,title | python3 -c "import json, os, sys; data = json.load(sys.stdin); print(next((str(i['number']) for i in data if i['title'].startswith('[sync-conflict] ' + os.environ['BRANCH'])), ''))")"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo itsgreat2misha/StarPilot --body "Upstream sync conflicted again on $DATE for $BRANCH (upstream $UPSTREAM_HEAD, fork head $OLD_HEAD). Conflicted files:
          \`\`\`
          $FILES
          \`\`\`
          Nothing was pushed for this branch. See the original issue body for the manual resolve steps."
          else
            gh issue create --repo itsgreat2misha/StarPilot --title "$TITLE" --body "$BODY"
          fi

      - name: Open issue if our changes were lost in a clean merge (no push, fail loudly if this fails)
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.conflict != 'true' && steps.verify.outputs.lost == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ matrix.branch }}
          UPSTREAM_HEAD: ${{ steps.merge.outputs.upstream_head }}
          OLD_HEAD: ${{ steps.merge.outputs.old_head }}
          LOST_FILES: ${{ steps.verify.outputs.lost_files }}
        run: |
          # No continue-on-error here on purpose (see conflict issue step).
          if [ "$BRANCH" = "gv70-smooth" ]; then
            INTENDED="SP-GAIN v1 + move-off calming + SysIndReq + damping 100"
          else
            INTENDED="approach-build + gated TurnAssist + crawl + friction + broad calm + SysIndReq + damping 100, NO latAccelFactor #3, NO SP-GAIN"
          fi
          DATE="$(date -u +%F)"
          TITLE="[sync-conflict] $BRANCH — branch changes LOST in clean upstream merge $DATE"
          BODY="Daily upstream sync merged cleanly into $BRANCH, but our changes were LOST in the merge: the files below differed from upstream Dom before the merge and no longer do afterwards (or are missing), so NOTHING was pushed for this branch and the comma is unchanged.

          - Branch: $BRANCH
          - Upstream Dom commit attempted: $UPSTREAM_HEAD
          - Fork head before merge: $OLD_HEAD
          - Files whose branch changes were lost:
          \`\`\`
          $LOST_FILES
          \`\`\`

          This usually means upstream refactored one of our files and git auto-merged the branch changes away. Re-apply the intended branch state ($INTENDED) on top of the new upstream code and re-test before pushing."
          EXISTING="$(gh issue list --repo itsgreat2misha/StarPilot --state open --limit 100 --json number,title | python3 -c "import json, os, sys; data = json.load(sys.stdin); print(next((str(i['number']) for i in data if i['title'].startswith('[sync-conflict] ' + os.environ['BRANCH'])), ''))")"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo itsgreat2misha/StarPilot --body "Upstream sync on $DATE for $BRANCH merged cleanly but branch changes were LOST (upstream $UPSTREAM_HEAD, fork head $OLD_HEAD). Lost files: $LOST_FILES. Nothing was pushed. See the original issue body for the manual re-apply steps."
          else
            gh issue create --repo itsgreat2misha/StarPilot --title "$TITLE" --body "$BODY"
          fi

      - name: Push merged branch and write summary
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.conflict != 'true' && steps.verify.outputs.lost != 'true'
        run: |
          BRANCH="${{ matrix.branch }}"
          if [ "${{ steps.merge.outputs.up_to_date }}" = "true" ]; then
            {
              echo "### Already up to date: $BRANCH"
              echo "- Head: ${{ steps.merge.outputs.old_head }} (unchanged)"
              echo "- Upstream Dom head: ${{ steps.merge.outputs.upstream_head }}"
              echo "Nothing to merge, nothing pushed. Receipt at head verified by the workflow's self-validated digest."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            git push origin "$BRANCH"
            {
              echo "### Upstream sync pushed: $BRANCH"
              echo "- Old head: ${{ steps.merge.outputs.old_head }}"
              echo "- New head: ${{ steps.receipt.outputs.new_head }}"
              echo "- Upstream Dom head: ${{ steps.merge.outputs.upstream_head }}"
              echo "- Files changed by merge: ${{ steps.merge.outputs.files }}"
              echo "- Receipt-only conflict auto-resolved: ${{ steps.merge.outputs.receipt_conflict_only }}"
              echo "- prebuilt.json receipt recomputed by workflow: ${{ steps.receipt.outputs.receipt_changed }} (digest self-validated against the previous head before the merge, and verified against the new tree after writing — the new head is Galaxy-safe as-is)"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${{ steps.verify.outputs.touched_files }}" ]; then
              {
                echo ""
                echo "## ⚠ Upstream changed files we experiment with"
                echo "The merge changed these files on $BRANCH while keeping our diffs intact:"
                echo "${{ steps.verify.outputs.touched_files }}" | tr ',' '\n' | sed 's/^/- /'
                echo ""
                echo "Route analysis should account for these upstream changes when judging this branch's behaviour."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Fail job if sync did not push (conflict or lost changes)
        if: steps.check.outputs.skip != 'true' && (steps.merge.outputs.conflict == 'true' || steps.verify.outputs.lost == 'true')
        run: |
          echo "Sync did not push for ${{ matrix.branch }}: conflict=${{ steps.merge.outputs.conflict }}, lost=${{ steps.verify.outputs.lost }}"
          echo "See the GitHub issue and job summary. Branch unchanged."
          exit 1
